<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh Giá - Shoe Haven</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #666666;
            overflow-x: hidden;
        }
        .header {
            background: #666666;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #999999;
            color: #ffffff;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .header:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(102, 102, 102, 0.5);
        }
        .sidebar {
            width: 250px;
            background: #666666;
            padding: 20px;
            position: fixed;
            height: 100%;
            box-shadow: 2px 0 10px rgba(102, 102, 102, 0.2);
            transition: width 0.3s, box-shadow 0.3s;
        }
        .sidebar:hover {
            width: 260px;
            box-shadow: 2px 0 15px rgba(102, 102, 102, 0.5);
        }
        .sidebar img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            margin-bottom: 20px;
            transition: transform 0.5s, box-shadow 0.3s;
        }
        .sidebar img:hover {
            transform: rotate(360deg) scale(1.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }
        .sidebar a {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .sidebar a:hover {
            background: #999999;
            transform: translateX(15px);
            box-shadow: 0 2px 5px rgba(102, 102, 102, 0.3) inset;
        }
        .sidebar .logout {
            background: #999999;
            color: #ffffff;
            text-align: center;
            margin-top: 30px;
            padding: 12px;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .sidebar .logout:hover {
            background: #4d4d4d;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(102, 102, 102, 0.5);
        }
        .content {
            margin-left: 270px;
            padding: 30px;
            min-height: 70vh;
            background: #ffffff;
            border-left: 1px solid #999999;
            transition: margin-left 0.3s, box-shadow 0.3s;
        }
        .content:hover {
            box-shadow: 0 0 10px rgba(102, 102, 102, 0.2);
        }
        .review-form {
            background: #ffffff;
            padding: 25px;
            border: 1px solid #999999;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(102, 102, 102, 0.1);
            animation: bounceIn 0.7s ease-out;
        }
        @keyframes bounceIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .review-form h2 {
            color: #666666;
            margin-bottom: 15px;
            font-size: 22px;
            text-align: center;
        }
        .review-form label {
            display: block;
            margin: 15px 0 5px;
            color: #666666;
            font-size: 16px;
            transition: transform 0.3s, text-shadow 0.3s;
        }
        .review-form label:hover {
            transform: translateX(5px);
            text-shadow: 0 0 3px rgba(102, 102, 102, 0.3);
        }
        .review-form input, .review-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #999999;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .review-form input:focus, .review-form textarea:focus {
            border-color: #666666;
            box-shadow: 0 0 5px rgba(102, 102, 102, 0.5);
        }
        .review-form textarea {
            height: 100px;
        }
        .review-form button {
            background: #666666;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .review-form button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(102, 102, 102, 0.5);
        }
        .footer {
            background: #666666;
            text-align: center;
            padding: 15px;
            margin-left: 270px;
            border-top: 2px solid #999999;
            color: #ffffff;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .footer:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(102, 102, 102, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">menu</div>
    <div class="sidebar">
        <img src="https://via.placeholder.com/60" alt="User Avatar">
        <a href="account.html">TÀI KHOẢN</a>
        <a href="cart.html">GIỎ HÀNG</a>
        <a href="order.html">ĐƠN HÀNG</a>
        <a href="review.html">ĐÁNH GIÁ</a>
        <a href="#" class="logout">ĐĂNG XUẤT</a>
    </div>
    <div class="content">
        <div class="review-form">
            <h2>Đánh Giá Sản Phẩm</h2>
            <label for="product">Sản phẩm:</label>
            <input type="text" id="product" value="Giày Thể Thao X1">
            <label for="comment">Nhận xét:</label>
            <textarea id="comment" placeholder="Viết nhận xét của bạn..."></textarea>
            <button>Gửi đánh giá</button>
        </div>
    </div>
    <div class="footer">© 2025 Shoe Haven</div>
</body>
</html>
