<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Shoe Haven</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #666666;
            overflow-x: hidden;
        }
        .header {
            background: #666666;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #999999;
            color: #ffffff;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .header:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(102, 102, 102, 0.5);
        }
        .sidebar {
            width: 250px;
            background: #666666;
            padding: 20px;
            position: fixed;
            height: 100%;
            box-shadow: 2px 0 10px rgba(102, 102, 102, 0.2);
            transition: width 0.3s, box-shadow 0.3s;
        }
        .sidebar:hover {
            width: 260px;
            box-shadow: 2px 0 15px rgba(102, 102, 102, 0.5);
        }
        .sidebar img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            margin-bottom: 20px;
            transition: transform 0.5s, box-shadow 0.3s;
        }
        .sidebar img:hover {
            transform: rotate(360deg) scale(1.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }
        .sidebar a {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .sidebar a:hover {
            background: #999999;
            transform: translateX(15px);
            box-shadow: 0 2px 5px rgba(102, 102, 102, 0.3) inset;
        }
        .sidebar .logout {
            background: #999999;
            color: #ffffff;
            text-align: center;
            margin-top: 30px;
            padding: 12px;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .sidebar .logout:hover {
            background: #4d4d4d;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(102, 102, 102, 0.5);
        }
        .content {
            margin-left: 270px;
            padding: 30px;
            min-height: 70vh;
            background: #ffffff;
            border-left: 1px solid #999999;
            transition: margin-left 0.3s, box-shadow 0.3s;
        }
        .content:hover {
            box-shadow: 0 0 10px rgba(102, 102, 102, 0.2);
        }
        .cart-items {
            background: #ffffff;
            padding: 25px;
            border: 1px solid #999999;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(102, 102, 102, 0.1);
            animation: slideInLeft 0.7s ease-out;
        }
        @keyframes slideInLeft {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .cart-items h2 {
            color: #666666;
            margin-bottom: 15px;
            font-size: 22px;
            text-align: center;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #999999;
            background: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .cart-item:hover {
            transform: translateX(15px);
            box-shadow: 0 5px 15px rgba(102, 102, 102, 0.3);
        }
        .cart-item img {
            width: 80px;
            height: 80px;
            border-radius: 5px;
            margin-right: 15px;
            border: 2px solid #666666;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .cart-item img:hover {
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(102, 102, 102, 0.5);
        }
        .cart-item .details {
            flex-grow: 1;
        }
        .cart-item h3 {
            margin: 0;
            color: #666666;
            font-size: 18px;
            transition: text-shadow 0.3s;
        }
        .cart-item h3:hover {
            text-shadow: 0 0 5px rgba(102, 102, 102, 0.5);
        }
        .cart-item p {
            margin: 5px 0;
            color: #999999;
            font-weight: bold;
            transition: color 0.3s;
        }
        .cart-item p:hover {
            color: #4d4d4d;
        }
        .cart-item input {
            width: 50px;
            padding: 5px;
            border: 1px solid #999999;
            border-radius: 5px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .cart-item input:focus {
            border-color: #666666;
            box-shadow: 0 0 5px rgba(102, 102, 102, 0.5);
        }
        .cart-item button {
            background: #999999;
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .cart-item button:hover {
            background: #4d4d4d;
            transform: scale(1.1);
            box-shadow: 0 2px 5px rgba(102, 102, 102, 0.3);
        }
        .total {
            text-align: right;
            margin-top: 15px;
            font-size: 18px;
            color: #666666;
            font-weight: bold;
            animation: fadeIn 0.7s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .footer {
            background: #666666;
            text-align: center;
            padding: 15px;
            margin-left: 270px;
            border-top: 2px solid #999999;
            color: #ffffff;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .footer:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(102, 102, 102, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">menu</div>
    <div class="sidebar">
        <img src="https://via.placeholder.com/60" alt="User Avatar">
        <a href="account.html">TÀI KHOẢN</a>
        <a href="cart.html">GIỎ HÀNG</a>
        <a href="order.html">ĐƠN HÀNG</a>
        <a href="review.html">ĐÁNH GIÁ</a>
        <a href="#" class="logout">ĐĂNG XUẤT</a>
    </div>
    <div class="content">
        <div class="cart-items">
            <h2>Giỏ Hàng</h2>
            <div class="cart-item">
                <img src="https://via.placeholder.com/80x80/666/fff?text=Giày+1" alt="Shoe 1">
                <div class="details">
                    <h3>Giày Thể Thao X1</h3>
                    <p>1.200.000 VNĐ</p>
                    <input type="number" value="1" min="1">
                    <button>Xóa</button>
                </div>
            </div>
            <div class="total">Tổng: 1.200.000 VNĐ</div>
        </div>
    </div>
    <div class="footer">© 2025 Shoe Haven</div>
</body>
</html>
