<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Giỏ hàng của bạn tại Shoe Haven - Giày thời trang cao cấp">
    <title>Giỏ Hàng - Shoe Haven</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff6f61, #6b48ff, #ff9a9e);
            color: #fff;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background 0.3s;
        }

        .header:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .header .logo {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 111, 97, 0.8);
            transition: text-shadow 0.3s;
        }

        .header .logo:hover {
            text-shadow: 0 0 25px rgba(255, 111, 97, 1);
        }

        .hamburger {
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s, transform 0.3s;
        }

        .hamburger:hover {
            color: #ff6f61;
            transform: rotate(90deg);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px 20px;
            position: fixed;
            height: 100%;
            transform: translateX(-100%);
            transition: transform 0.5s ease, background 0.3s;
            z-index: 1001;
            border-right: 1px solid rgba(255, 111, 97, 0.3);
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #ff6f61;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 20px rgba(255, 111, 97, 0.7);
            transition: transform 0.5s, box-shadow 0.3s;
        }

        .sidebar img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 30px rgba(255, 111, 97, 1);
        }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 15px;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            transition: background 0.3s, color 0.3s, transform 0.3s, box-shadow 0.3s;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .sidebar a i {
            margin-right: 15px;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .sidebar a:hover {
            background: linear-gradient(90deg, #ff6f61, #6b48ff);
            color: #fff;
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(255, 111, 97, 0.5);
        }

        .sidebar a:hover i {
            transform: scale(1.2);
        }

        .sidebar .logout {
            background: #6b48ff;
            text-align: center;
            margin-top: 40px;
            padding: 15px;
            border-radius: 10px;
            transition: background 0.3s, transform 0.3s;
        }

        .sidebar .logout:hover {
            background: #5a3ed9;
            transform: scale(1.05);
        }

        /* Content */
        .content {
            margin-left: 0;
            padding: 50px 30px;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            transition: padding 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content:hover {
            padding: 60px 40px;
        }

        .cart-items {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 80%;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideInLeft 0.7s ease-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 70%; /* Thêm chiều cao để căn giữa dọc */
        }

        @keyframes slideInLeft {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .cart-items h2 {
            font-size: 32px;
            color: #fff;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 111, 97, 0.8);
            transition: text-shadow 0.3s;
        }

        .cart-items h2:hover {
            text-shadow: 0 0 25px rgba(255, 111, 97, 1);
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            margin-bottom: 20px;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            position: relative;
            overflow: hidden;
        }

        .cart-item:hover {
            transform: translateX(15px);
            box-shadow: 0 5px 15px rgba(255, 111, 97, 0.5);
            background: rgba(255, 111, 97, 0.3);
        }

        .cart-item::after {
            content: '';
            position: absolute;
            width: 0;
            height: 100%;
            top: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.1);
            transition: width 0.3s;
        }

        .cart-item:hover::after {
            width: 100%;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            margin-right: 20px;
            border: 3px solid #fff;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cart-item img:hover {
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255, 111, 97, 0.7);
        }

        .cart-item .details {
            flex-grow: 1;
            text-align: left;
        }

        .cart-item h3 {
            margin: 0;
            color: #fff;
            font-size: 20px;
            transition: text-shadow 0.3s;
        }

        .cart-item h3:hover {
            text-shadow: 0 0 10px rgba(255, 111, 97, 0.8);
        }

        .cart-item p {
            margin: 5px 0;
            color: #ddd;
            font-weight: 500;
            transition: color 0.3s;
        }

        .cart-item p:hover {
            color: #fff;
        }

        .cart-item input {
            width: 60px;
            padding: 8px;
            border: 1px solid #fff;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
        }

        .cart-item input:focus {
            border-color: #ff6f61;
            box-shadow: 0 0 10px rgba(255, 111, 97, 0.5);
            transform: scale(1.05);
        }

        .cart-item button {
            background: #6b48ff;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .cart-item button:hover {
            background: #5a3ed9;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(107, 72, 255, 0.7);
        }

        .cart-item button:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(107, 72, 255, 0.5);
        }

        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 22px;
            color: #fff;
            font-weight: 600;
            background: rgba(255, 111, 97, 0.3);
            padding: 10px 20px;
            border-radius: 15px;
            transition: transform 0.3s, background 0.3s;
        }

        .total:hover {
            transform: scale(1.05);
            background: rgba(255, 111, 97, 0.5);
        }

        /* Background Shoes */
        .shoe-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        .shoe-bg img {
            width: 200px;
            height: auto;
            position: absolute;
            animation: floatAndRotate 8s infinite ease-in-out;
            transition: transform 0.3s;
        }

        .shoe-bg img:hover {
            transform: scale(1.1) rotate(10deg);
        }

        @keyframes floatAndRotate {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* Responsive */
        @media (min-width: 768px) {
            .content {
                margin-left: 250px;
            }
        }

        @media (max-width: 768px) {
            .cart-items {
                padding: 20px;
                width: 90%;
                height: 80%; /* Điều chỉnh chiều cao trên màn hình nhỏ */
            }

            .cart-item img {
                width: 80px;
                height: 80px;
            }

            .shoe-bg img {
                width: 150px;
            }
        }

        .content {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin-left: 0; /* nếu bạn muốn bỏ khoảng trống bên trái */

}


    </style>
</head>
<body>
    <div class="header">
        <div class="hamburger"><i class="fas fa-bars"></i></div>
        <div class="logo">Shop</div>
    </div>

    <div class="sidebar">
        <img src="../hình/image.png" alt="User Avatar">
        <a href="account.html"><i class="fas fa-user"></i> Tài Khoản</a>
        <a href="cart.html"><i class="fas fa-shopping-cart"></i> Giỏ Hàng</a>
        <a href="order.html"><i class="fas fa-box"></i> Đơn Hàng</a>
        <a href="review.html"><i class="fas fa-star"></i> Đánh Giá</a>
        <a href="#" class="logout"><i class="fas fa-sign-out-alt"></i> Đăng Xuất</a>
    </div>

    <div class="content">
        <div class="cart-items">
            <h2>Giỏ Hàng</h2>
            <div class="cart-item">
                <img src="../hình/image copy 2.png" alt="Shoe 1">
                <div class="details">
                    <h3>Giày Thể Thao X1</h3>
                    <p>1.200.000 VNĐ</p>
                    <input type="number" value="1" min="1">
                    <button class="remove-btn">Xóa</button>
                </div>
            </div>
            <div class="cart-item">
                <img src="../hình/image copy 3.png" alt="Shoe 2">
                <div class="details">
                    <h3>Giày Sneaker Y2</h3>
                    <p>1.500.000 VNĐ</p>
                    <input type="number" value="2" min="1">
                    <button class="remove-btn">Xóa</button>
                </div>
            </div>
            <div class="total">Tổng: 4.200.000 VNĐ</div>
        </div>

        <div class="shoe-bg">
            <img src="../hình/image copy 3.png" alt="Shoe 1" style="top: 5%; left: 5%;">
            <img src="../hình/image copy 2.png" alt="Shoe 2" style="top: 40%; right: 5%;">
            <img src="../hình/image copy.png" alt="Shoe 3" style="bottom: 5%; left: 10%;"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Toggle sidebar
            $('.hamburger').click(function() {
                $('.sidebar').toggleClass('active');
                $(this).toggleClass('active');
                if ($(this).hasClass('active')) {
                    $(this).css('transform', 'rotate(90deg)');
                } else {
                    $(this).css('transform', 'rotate(0deg)');
                }
            });

            // Hover effects on sidebar links
            $('.sidebar a').hover(
                function() {
                    $(this).css({
                        'background': 'linear-gradient(90deg, #ff6f61, #6b48ff)',
                        'color': '#fff',
                        'transform': 'translateX(10px)',
                        'box-shadow': '0 5px 15px rgba(255, 111, 97, 0.5)'
                    });
                    $(this).find('i').css('transform', 'scale(1.2)');
                },
                function() {
                    if (!$(this).hasClass('active-link')) {
                        $(this).css({
                            'background': 'transparent',
                            'color': '#fff',
                            'transform': 'translateX(0)',
                            'box-shadow': 'none'
                        });
                        $(this).find('i').css('transform', 'scale(1)');
                    }
                }
            );

            // Click effect on remove buttons
            $('.remove-btn').click(function() {
                $(this).addClass('clicked');
                $(this).closest('.cart-item').fadeOut(400, function() {
                    $(this).remove();
                    updateTotal();
                });
                setTimeout(() => $(this).removeClass('clicked'), 200);
            });

            // Hover and click effect on cart items
            $('.cart-item').hover(
                function() {
                    $(this).css({
                        'transform': 'translateX(15px)',
                        'box-shadow': '0 5px 15px rgba(255, 111, 97, 0.5)',
                        'background': 'rgba(255, 111, 97, 0.3)'
                    });
                    $(this).find('.cart-item::after').css('width', '100%');
                },
                function() {
                    $(this).css({
                        'transform': 'translateX(0)',
                        'box-shadow': 'none',
                        'background': 'rgba(255, 255, 255, 0.2)'
                    });
                    $(this).find('.cart-item::after').css('width', '0');
                }
            );

            $('.cart-item img').hover(
                function() {
                    $(this).css('transform', 'scale(1.15)');
                    $(this).css('box-shadow', '0 0 15px rgba(255, 111, 97, 0.7)');
                },
                function() {
                    $(this).css('transform', 'scale(1)');
                    $(this).css('box-shadow', 'none');
                }
            );

            $('.cart-item input').focus(function() {
                $(this).css({
                    'border-color': '#ff6f61',
                    'box-shadow': '0 0 10px rgba(255, 111, 97, 0.5)',
                    'transform': 'scale(1.05)'
                });
            }).blur(function() {
                $(this).css({
                    'border-color': '#fff',
                    'box-shadow': 'none',
                    'transform': 'scale(1)'
                });
            });

            $('.cart-item button').hover(
                function() {
                    $(this).css({
                        'background': '#5a3ed9',
                        'transform': 'scale(1.1)',
                        'box-shadow': '0 0 15px rgba(107, 72, 255, 0.7)'
                    });
                },
                function() {
                    $(this).css({
                        'background': '#6b48ff',
                        'transform': 'scale(1)',
                        'box-shadow': 'none'
                    });
                }
            ).click(function() {
                $(this).css('transform', 'scale(0.95)');
                setTimeout(() => $(this).css('transform', 'scale(1)'), 100);
            });

            $('.total').hover(
                function() {
                    $(this).css({
                        'transform': 'scale(1.05)',
                        'background': 'rgba(255, 111, 97, 0.5)'
                    });
                },
                function() {
                    $(this).css({
                        'transform': 'scale(1)',
                        'background': 'rgba(255, 111, 97, 0.3)'
                    });
                }
            );

            // Move shoes randomly
            function moveShoes() {
                $('.shoe-bg img').each(function() {
                    let top = Math.random() * 80 + '%';
                    let left = Math.random() * 80 + '%';
                    $(this).css({ top: top, left: left });
                });
            }
            setInterval(moveShoes, 6000);

            // Hover effect on shoes
            $('.shoe-bg img').hover(
                function() {
                    $(this).css('transform', 'scale(1.1) rotate(10deg)');
                },
                function() {
                    $(this).css('transform', 'scale(1) rotate(0deg)');
                }
            );

            // Update total when quantity changes
            function updateTotal() {
                let total = 0;
                $('.cart-item').each(function() {
                    let price = parseInt($(this).find('p').text().replace(' VNĐ', '').replace('.', ''));
                    let qty = parseInt($(this).find('input').val());
                    total += price * qty;
                });
                $('.total').text('Tổng: ' + total.toLocaleString() + ' VNĐ');
            }

            $('.cart-item input').on('input', function() {
                if ($(this).val() < 1) $(this).val(1);
                updateTotal();
            });
        });
    </script>
</body>
</html>
