<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Product Panel</title>
  <link rel="stylesheet" href="../style/admin.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <div class="container">
    <form id="product-form" action="../../controllers/admin.php" method="POST" enctype="multipart/form-data">
      <div class="image-upload">
        <div id="preview-images" class="images"></div>
        <div class="add-img">
          <label for="image-input" style="cursor:pointer;color:#1976d2;font-weight:bold;">Thêm IMG</label>
          <input type="file" id="image-input" name="images[]" accept="image/*" multiple style="display:none;">
          <span class="img-icon" style="cursor:pointer;" onclick="document.getElementById('image-input').click();">
            <i class='bx bx-image'></i>
          </span>
        </div>
      </div>
      <input type="hidden" name="sizes_raw" id="sizes_raw">
      <input type="hidden" name="add_product" value="1">
      <input type="hidden" name="color" id="color_input">

      <div class="field">
        <label>Shoe Name</label>
        <input type="text" name="name" id="name" required>
      </div>
      <div class="field">
        <label>Shoe Type</label>
        <input type="text" name="type" id="type" required>
      </div>
      <div class="field">
        <label>Price ($)</label>
        <input type="number" step="0.01" name="price" id="price" required>
      </div>

      <div class="flex-row">
        <label>Size</label>
        <div id="size-tags" class="tag-box"></div>
        <input type="text" id="size-input" placeholder="Enter size and press Enter">
      </div>

      <div class="flex-row">
        <label>Color</label>
        <div id="color-tags" class="tag-box"></div>
        <input type="text" id="color-input-field" placeholder="Enter color and press Enter">
      </div>

      <div class="buttons">
        <button type="submit" class="add-btn">Add</button>
        <button type="reset" class="cancel-btn">Cancel</button>
      </div>
    </form>

    <h3>Products</h3>
    <table class="product-table" id="product-table">
      <thead>
        <tr>
          <th>IMG</th>
          <th>Shoe Name</th>
          <th>Shoe Type</th>
          <th>Size</th>
          <th>Color</th>
          <th>Price ($)</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
