<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../public/style/admin.css">
</head>
<body>
    <h1>Manage Product Tags</h1>
    <form id="tagForm">
        <label for="shoeName">Shoe Name</label>
        <input type="text" id="shoeName" name="shoeName" required>

        <label for="color">Color</label>
        <input type="text" id="color" name="color" required>

        <label for="shoeType">Shoe Type</label>
        <select id="shoeType" name="shoeType" required>
            <option value="">Select Type</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="children">Children</option>
        </select>

        <label for="brand">Brand</label>
        <select id="brand" name="brand" required>
            <option value="">Select Brand</option>
            <option value="Nike">Nike</option>
            <option value="Adidas">Adidas</option>
            <option value="Puma">Puma</option>
            <option value="Reebok">Reebok</option>
            <option value="New Balance">New Balance</option>
            <option value="Other">Other</option>
        </select>

        <label for="shoeSize">Shoe Size</label>
        <input type="checkbox">Remember me</label>

        <label for="price">Price ($)</label>
        <input type="number" id="price" name="price" min="0" step="0.01" required>

        <button type="submit">Add Tag</button>
    </form>

    <table id="tagsTable">
        <thead>
            <tr>
                <th>Shoe Name</th>
                <th>Color</th>
                <th>Shoe Type</th>
                <th>Brand</th>
                <th>Shoe Size</th>
                <th>Price ($)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Product tags will be added here -->
        </tbody>
    </table>

    <script>
        const tagForm = document.getElementById('tagForm');
        const tagsTableBody = document.querySelector('#tagsTable tbody');

        tagForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const shoeName = document.getElementById('shoeName').value;
            const color = document.getElementById('color').value;
            const shoeType = document.getElementById('shoeType').value;
            const brand = document.getElementById('brand').value;
            const shoeSize = document.getElementById('shoeSize').value;
            const price = document.getElementById('price').value;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${shoeName}</td>
                <td>${color}</td>
                <td>${shoeType}</td>
                <td>${brand}</td>
                <td>${shoeSize}</td>
                <td>${parseFloat(price).toFixed(2)}</td>
            `;
            tagsTableBody.appendChild(row);

            tagForm.reset();
        });
    </script>
</body>
</html>
