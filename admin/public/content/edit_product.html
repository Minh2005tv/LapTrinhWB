<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chỉnh sửa sản phẩm</title>
  <link rel="stylesheet" href="../style/menu.css">
  <link rel="stylesheet" href="../style/edit_product.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>ShoePro <span>Admin</span></h2>
      </div>
      <ul class="sidebar-menu">
        <li><a href="../content/admin.html"><i class='bx bx-box'></i> <span>Quản lý sản phẩm</span></a></li>
        <li><a href="../../../pages/error/error.html"><i class='bx bx-cart'></i> <span>Đơn hàng</span></a></li>
        <li><a href="../../../pages/error/error.html"><i class='bx bx-cog'></i> <span>Cài đặt</span></a></li>
        <li><a href="../../../pages/error/error.html"><i class='bx bx-log-out'></i> <span>Đăng xuất</span></a></li>
      </ul>
    </div>

 <div class="main-content">
  <div class="container">
   <form id="product-form" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="id" id="product_id">
    <input type="hidden" name="edit_product" value="1">
    <input type="hidden" name="sizes_raw" id="sizes_raw">
    <input type="hidden" name="color" id="color_input">

    <div class="image-upload">
     <div id="preview-images" class="images"></div>
    </div>

    <div class="field">
     <label>Shoe Name</label>
     <input type="text" name="name" id="name" required>
    </div>
    <div class="field">
     <label>Shoe Type</label>
     <input type="text" name="type" id="type" required>
    </div>
    <div class="field">
     <label>Price ($)</label>
     <input type="number" step="0.01" name="price" id="price" required>
    </div>

    <div class="flex-row">
     <label>Size</label>
     <div id="size-tags" class="tag-box"></div>
     <input type="text" id="size-input" placeholder="Enter size and press Enter">
    </div>

    <div class="flex-row">
     <label>Color</label>
     <div id="color-tags" class="tag-box"></div>
     <input type="text" id="color-input-field" placeholder="Enter color and press Enter">
    </div>

    <div class="field">
     <label>Date & Time</label>
     <input type="datetime-local" name="date_time" id="date_time">
    </div>

    <div class="field">
     <label>Sales</label>
     <input type="number" name="sales" id="sales" min="0">
    </div>

    <div class="buttons">
     <button type="submit" class="save-btn">Save</button>
     <button type="reset" class="cancel-btn">Cancel</button>
    </div>
   </form>
  </div>
 </div>

 <script>
 document.addEventListener('DOMContentLoaded', function () {
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');
  if (!productId) return alert("Không có ID sản phẩm");

  const form = document.getElementById('product-form');
  const sizeInput = document.getElementById('size-input');
  const sizeTags = document.getElementById('size-tags');
  const colorInput = document.getElementById('color-input-field');
  const colorTags = document.getElementById('color-tags');
  const preview = document.getElementById('preview-images');
  let sizes = [], colors = [];

  function renderTags(container, arr) {
   container.innerHTML = '';
   arr.forEach((val, i) => {
    let tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = val;
    let rm = document.createElement('span');
    rm.textContent = ' ×';
    rm.style.cursor = 'pointer';
    rm.onclick = () => { arr.splice(i, 1); renderTags(container, arr); };
    tag.appendChild(rm);
    container.appendChild(tag);
   });
  }

  fetch('../../controllers/get_products.php')
   .then(res => res.json())
   .then(products => {
    const product = products.find(p => p.id == productId);
    if (!product) return alert('Không tìm thấy sản phẩm');

    form.name.value = product.name;
    form.type.value = product.type;
    form.price.value = product.price;
    form.date_time.value = product.date_time || '';
    form.sales.value = product.sales || '';
    document.getElementById('product_id').value = productId;

    sizes = product.sizes || [];
    colors = product.colors || [];
    renderTags(sizeTags, sizes);
    renderTags(colorTags, colors);

    preview.innerHTML = '';
    product.images.forEach(url => {
     const img = document.createElement('img');
     img.src = `/Website_Selling sports shoes/${url}`;
     img.style.width = '60px';
     img.style.margin = '5px';
     preview.appendChild(img);
    });
   });

  form.addEventListener('submit', function (e) {
   e.preventDefault();
   if (sizes.length === 0 || colors.length === 0) return alert('Phải nhập ít nhất 1 size và 1 màu');
   document.getElementById('sizes_raw').value = JSON.stringify(sizes);
   document.getElementById('color_input').value = JSON.stringify(colors);

   const formData = new FormData(form);

   fetch('../../controllers/edit_product.php', {
    method: 'POST',
    body: formData
   })
   .then(res => res.json())
   .then(data => {
    alert(data.message);
    if (data.success) {
     setTimeout(() => {
      window.location.href = 'Admin.html';
     }, 1000);
    }
   });
  });

  sizeInput.addEventListener('keydown', function (e) {
   if (e.key === 'Enter' && sizeInput.value.trim() !== '') {
    e.preventDefault();
    sizes.push(sizeInput.value.trim());
    renderTags(sizeTags, sizes);
    sizeInput.value = '';
   }
  });

  colorInput.addEventListener('keydown', function (e) {
   if (e.key === 'Enter' && colorInput.value.trim() !== '') {
    e.preventDefault();
    colors.push(colorInput.value.trim());
    renderTags(colorTags, colors);
    colorInput.value = '';
   }
  });
 });
 </script>
</body>
</html>
