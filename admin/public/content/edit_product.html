<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Product Panel - Edit</title>
  <link rel="stylesheet" href="../style/style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <!-- Menu Admin -->
  <div class="sidebar" id="sidebar">
    <div class="logo">Admin</div>
    <ul>
      <li style="background-color: #34495e;"><i class='bx bx-home'></i><span>Dashboard</span></li>
      <li><i class='bx bx-box'></i><span>Quản lý sản phẩm</span></li>
      <li><i class='bx bx-cart'></i><span>Đơn hàng</span></li>
      <li><i class='bx bx-cog'></i><span>Cài đặt</span></li>
      <li><i class='bx bx-log-out'></i><span>Đăng xuất</span></li>
    </ul>
  </div>
  <div class="main-content">
    <button class="toggle-btn" onclick="toggleSidebar()">☰ Menu</button>
    <div class="container">
      <form id="edit-product-form" action="../../controllers/edit_product.php" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="id" id="product-id">
        <input type="hidden" name="sizes_raw" id="sizes_raw">
        <input type="hidden" name="color" id="color_input">
        <input type="hidden" name="edit_product" value="1">

        <div class="image-upload">
          <div id="preview-images" class="images"></div>
          <div class="add-img">
            <label for="image-input" style="cursor:pointer;color:#1976d2;font-weight:bold;">Thêm IMG</label>
            <input type="file" id="image-input" name="images[]" accept="image/*" multiple style="display:none;">
            <span class="img-icon" style="cursor:pointer;" onclick="document.getElementById('image-input').click();">
              <i class='bx bx-image'></i>
            </span>
          </div>
        </div>

        <div class="field">
          <label style="color: #2c3e50;">Shoe Name</label>
          <input type="text" name="name" id="name" required style="border-color: #2c3e50;">
        </div>
        <div class="field">
          <label style="color: #2c3e50;">Shoe Type</label>
          <input type="text" name="type" id="type" required style="border-color: #2c3e50;">
        </div>
        <div class="field">
          <label style="color: #2c3e50;">Price ($)</label>
          <input type="number" step="0.01" name="price" id="price" required style="border-color: #2c3e50;">
        </div>

        <div class="flex-row">
          <label style="color: #2c3e50;">Size</label>
          <div id="size-tags" class="tag-box"></div>
          <input type="text" id="size-input" placeholder="Enter size and press Enter" style="border-color: #2c3e50;">
        </div>

        <div class="flex-row">
          <label style="color: #2c3e50;">Color</label>
          <div id="color-tags" class="tag-box"></div>
          <input type="text" id="color-input-field" placeholder="Enter color and press Enter" style="border-color: #2c3e50;">
        </div>

        <div class="field">
          <label style="color: #2c3e50;">Date & Time</label>
          <input type="datetime-local" name="date_time" id="date_time" style="border-color: #2c3e50;">
        </div>

        <div class="field">
          <label style="color: #2c3e50;">Sales</label>
          <input type="number" name="sales" id="sales" min="0" style="border-color: #2c3e50;">
        </div>

        <div class="buttons">
          <button type="button" class="save-btn" id="save-btn" style="background-color: #1abc9c;">Save</button>
          <button type="button" class="cancel-btn" id="cancel-btn" style="background-color: #e74c3c;">Cancel</button>
        </div>
      </form>
      <div id="confirmation-dialog" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:20px; border:1px solid #ccc;">
        <p>Nhấn chấp nhận để hoàn tất chỉnh sửa</p>
        <button id="confirm-accept" style="background-color: #1abc9c; color:white; margin-right:10px;">Chấp nhận</button>
        <button id="confirm-cancel" style="background-color: #e74c3c; color:white;">Hủy</button>
      </div>
    </div>
  </div>
  <script src="../js/edit_product.js"></script>
</body>
</html>
