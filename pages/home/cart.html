<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart & Payment</title>
    <link rel="stylesheet" href="../../assets/css/home/cart.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <script>
function updateCartSummary() {
  const allProducts = document.querySelectorAll(".product");
  let total = 0, count = 0;

  allProducts.forEach(p => {
    const checked = p.querySelector(".select-product").checked;
    const qty = parseInt(p.querySelector("input[type='number']").value);
    const price = parseFloat(p.dataset.price);

    if (checked) {
      total += qty * price;
      count++;
    }
  });

  document.getElementById("total").textContent = total + "$";
  document.getElementById("count").textContent = count;
}

function saveCartToLocalStorage() {
  const newCart = [];

  document.querySelectorAll(".product").forEach(p => {
    const name = p.querySelector(".product-title").textContent;
    const price = parseFloat(p.dataset.price);
    const image = p.querySelector("img").src;
    const size = p.querySelector(".size-select").value;
    const qty = parseInt(p.querySelector("input[type='number']").value);
    const color = ""; // (nếu bạn có tích hợp màu)

    newCart.push({ name, price, image, sizes: [size], colors: [color], quantity: qty });
  });

  localStorage.setItem("cart", JSON.stringify(newCart));
}

document.addEventListener("DOMContentLoaded", () => {
  const cartList = document.querySelector(".product-list");
  const storedCart = JSON.parse(localStorage.getItem("cart")) || [];

  cartList.innerHTML = "";

  storedCart.forEach((item, index) => {
    const product = document.createElement("div");
    product.className = "product";
    product.dataset.price = item.price;

    product.innerHTML = `
      <div class="product-img-wrap">
        <img src="${item.image}" alt="Product" />
      </div>
      <div class="product-info">
        <div class="product-title">${item.name}</div>
        <div class="product-meta">
          <span class="product-price">${item.price}$</span>
        </div>
        <div class="product-options">
          <label class="size-label">Size
            <select class="size-select">
              ${item.sizes.map(sz => `<option>${sz}</option>`).join("")}
            </select>
          </label>
          <div class="quantity-group">
            <button class="decrease"><i class="fa fa-minus"></i></button>
            <input type="number" value="${item.quantity}" readonly />
            <button class="increase"><i class="fa fa-plus"></i></button>
          </div>
        </div>
      </div>
      <input type="checkbox" class="select-product" />
      <button class="remove-btn" style="position: absolute; top: 10px; right: 10px; background: transparent; border: none; font-size: 18px; color: red; cursor: pointer;">&times;</button>
    `;

    cartList.appendChild(product);
  });

  // Xử lý sự kiện tăng/giảm/xóa
  cartList.addEventListener("click", function (e) {
    const product = e.target.closest(".product");

    if (e.target.classList.contains("increase")) {
      const input = product.querySelector("input[type='number']");
      input.value = parseInt(input.value) + 1;
      saveCartToLocalStorage();
      updateCartSummary();
    }

    if (e.target.classList.contains("decrease")) {
      const input = product.querySelector("input[type='number']");
      if (parseInt(input.value) > 1) {
        input.value = parseInt(input.value) - 1;
        saveCartToLocalStorage();
        updateCartSummary();
      }
    }

    if (e.target.classList.contains("remove-btn")) {
      product.remove();
      saveCartToLocalStorage();
      updateCartSummary();
    }

    if (e.target.classList.contains("select-product")) {
      updateCartSummary();
    }
  });

  document.getElementById("select-all").addEventListener("change", (e) => {
    const allChecks = document.querySelectorAll(".select-product");
    allChecks.forEach(chk => chk.checked = e.target.checked);
    updateCartSummary();
  });

  updateCartSummary();
});
</script>

  <body>
    <header class="main-header"><span class="hd-badge">HD</span><span class="menu-title">menu</span></header>
    <main class="container">
      <!-- Shopping Bag -->
      <section class="shopping-bag">
        <div class="bag-header">
          <h3>Shopping Bag</h3>
          <i class="fa fa-shopping-bag"></i>
        </div>
        <div class="product-list">
          <!-- Sản phẩm mẫu -->
          <div class="product" data-price="20">
            <div class="product-img-wrap">
              <img src="../../assets/img/slide-1.jpg" alt="Product" />
            </div>
            <div class="product-info">
              <div class="product-title">Giày Nike Air</div>
              <div class="product-meta">
                <span class="product-price">20$</span>
              </div>
              <div class="product-options">
                <label class="size-label">Size
                  <select class="size-select">
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                  </select>
                </label>
                <div class="quantity-group">
                  <button class="decrease"><i class="fa fa-minus"></i></button>
                  <input type="number" value="1" readonly />
                  <button class="increase"><i class="fa fa-plus"></i></button>
                </div>
              </div>
            </div>
            <input type="checkbox" class="select-product" />
          </div>
          <div class="product" data-price="30">
            <div class="product-img-wrap">
              <img src="../../assets/img/slide-2.jpg" alt="Product" />
            </div>
            <div class="product-info">
              <div class="product-title">New Balance</div>
              <div class="product-meta">
                <span class="product-price">30$</span>
              </div>
              <div class="product-options">
                <label class="size-label">Size
                  <select class="size-select">
                    <option>28</option>
                    <option>29</option>
                    <option>30</option>
                    <option>31</option>
                  </select>
                </label>
                <div class="quantity-group">
                  <button class="decrease"><i class="fa fa-minus"></i></button>
                  <input type="number" value="1" readonly />
                  <button class="increase"><i class="fa fa-plus"></i></button>
                </div>
              </div>
            </div>
            <input type="checkbox" class="select-product" />
          </div>
          <div class="product" data-price="25">
            <div class="product-img-wrap">
              <img src="../../assets/img/slide-3.jpg" alt="Product" />
            </div>
            <div class="product-info">
              <div class="product-title">Adidas</div>
              <div class="product-meta">
                <span class="product-price">25$</span>
              </div>
              <div class="product-options">
                <label class="size-label">Size
                  <select class="size-select">
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                  </select>
                </label>
                <div class="quantity-group">
                  <button class="decrease"><i class="fa fa-minus"></i></button>
                  <input type="number" value="1" readonly />
                  <button class="increase"><i class="fa fa-plus"></i></button>
                </div>
              </div>
            </div>
            <input type="checkbox" class="select-product" />
          </div>
        </div>
        <label class="select-all-label"><input type="checkbox" id="select-all" /> All</label>
      </section>
      <!-- Payment Section -->
      <section class="payment-summary">
        <h3>PAYMENT</h3>
        <div class="info">
          DELIVERY METHOD
          <select id="delivery-method" required>
            <option value="">--Select--</option>
            <option value="fast">Giao hàng nhanh</option>
            <option value="save">Giao hàng tiết kiệm</option>
          </select>
        </div>
        <div class="info">
          ADDRESS
          <input id="address" type="text" placeholder="Nhập địa chỉ nhận hàng" required />
        </div>
        <div class="info">
          PAYMENT
          <select id="payment-method" required>
            <option value="">--Select--</option>
            <option value="cod">Thanh toán khi nhận hàng</option>
            <option value="bank">Chuyển khoản ngân hàng</option>
          </select>
        </div>
        <div class="info">NUMBER OF PRODUCTS: <span id="count">0</span></div>
        <div class="info">TOTAL: <span id="total">0$</span></div>
        <button id="pay-btn">PAYMENT</button>
      </section>
    </main>
    <footer class="main-footer"><span>FOOTER</span></footer>
    <script src="../../assets/js/cart.js"></script>
    <div id="popup-noti"></div>
  </body>
</html>
