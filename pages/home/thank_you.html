<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You</title>
  <link rel="stylesheet" href="../../assets/css/home/header.css" />
  <link rel="stylesheet" href="../../assets/css/home/footer.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f6f9fc;
      text-align: center;
      padding: 80px 20px;
    }
    .thank-you-box {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .thank-you-box i {
      color: #28a745;
      font-size: 60px;
      margin-bottom: 20px;
    }
    .thank-you-box h2 {
      color: #333;
      margin-bottom: 10px;
    }
    .thank-you-box p {
      color: #666;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .thank-you-box a {
      display: inline-block;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.3s;
    }
    .thank-you-box a:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <i class="fa fa-check-circle"></i>
    <h2>Thanh toán thành công!</h2>
    <p>Cảm ơn bạn đã đặt hàng. Đơn hàng của bạn đang được xử lý.</p>
    <a href="home.html">Quay về trang chủ</a>
  </div>
</body>
</html>
