<!DOCTYPE html>
<html>
<head>
    <title>Đăng ký tài khoản</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; background: #f0f0f0; padding: 30px; }
        form { background: white; padding: 20px; width: 300px; margin: auto; border-radius: 10px; }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px; background: #28a745; color: white; border: none; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Đăng ký tài khoản</h2>
    <form method="POST" action="signup.php">
        <input type="text" name="full_name" placeholder="Họ tên" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Mật khẩu" required>
        <input type="text" name="phone_number" placeholder="Số điện thoại">
        <input type="text" name="address" placeholder="Địa chỉ">
        <button type="submit">Đăng ký</button>
    </form>
</body>
</html>
